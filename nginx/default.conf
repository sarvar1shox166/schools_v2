# ── Let's Encrypt HTTP-01 challenge + HTTP→HTTPS redirect ───────────────────
server {
    listen 80;
    server_name crm.chesson.uz api.chesson.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Fallback: IP-based / unmatched Host (no TLS) ─────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ws/ {
        proxy_pass         http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass             http://api:3001;
        proxy_http_version     1.1;
        proxy_set_header       Host            $host;
        proxy_set_header       X-Real-IP       $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size   4G;
        proxy_request_buffering off;
        client_body_timeout    3600s;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    location /uploads/ {
        proxy_pass http://api:3001;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
}

# ── crm.chesson.uz — Frontend SPA + API proxy (HTTPS) ────────────────────────
server {
    listen 443 ssl;
    server_name crm.chesson.uz;

    ssl_certificate     /etc/letsencrypt/live/crm.chesson.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.chesson.uz/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket (must be before /api/)
    location /api/v1/ws/ {
        proxy_pass         http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass             http://api:3001;
        proxy_http_version     1.1;
        proxy_set_header       Host            $host;
        proxy_set_header       X-Real-IP       $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size   4G;
        proxy_request_buffering off;
        # Sekin internetda katta video (3GB gacha) yuklashda ulanish uzilmasligi uchun
        client_body_timeout    3600s;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    location /uploads/ {
        proxy_pass http://api:3001;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
}

# ── api.chesson.uz — Direct API access (HTTPS) ───────────────────────────────
server {
    listen 443 ssl;
    server_name api.chesson.uz;

    ssl_certificate     /etc/letsencrypt/live/crm.chesson.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.chesson.uz/privkey.pem;

    location / {
        proxy_pass              http://api:3001;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade    $http_upgrade;
        proxy_set_header        Connection "upgrade";
        proxy_set_header        Host            $host;
        proxy_set_header        X-Real-IP       $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size    4G;
        proxy_request_buffering off;
        client_body_timeout     3600s;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }
}
